name: 每日收盤資料更新

on:
  schedule:
    # 07:00 UTC = 台北時間 15:00,收盤(13:30)後留緩衝時間再抓資料。只在週一到週五跑。
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {} # 允許在 GitHub 網頁上手動點「Run workflow」測試

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install requests yfinance pandas

      - name: 抓今日成交量與三日基準
        run: python fetch_data.py

      - name: 抓個股歷史K線
        run: python fetch_history.py

      - name: 計算大盤擇時訊號
        run: python fetch_signal.py

      - name: 計算三大法人動向
        run: python fetch_institutional.py

      - name: 更新紙上交易帳本
        run: python paper_trade.py

      - name: 產生網頁
        run: python build_html.py

      - name: 產生紙上交易報告
        run: python build_paper.py

      - name: 提交並推送(沒有變動就跳過)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "沒有資料變動,略過提交" || git commit -m "自動更新每日資料 $(date -u +%Y-%m-%d)"
          git push
